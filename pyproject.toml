[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kpastro"
version = "0.3.0"
description = "Precise Krishnamurti Paddhati (KP) astrology engine: ayanamsa, nakshatra, sub-lord chain, Placidus cusps, Vimshottari dasha, significators, ruling planets, KP horary and birth-time rectification."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rituparno Majumdar", email = "majumdarrituparno@gmail.com" }]
keywords = [
    "astrology", "kp", "krishnamurti", "paddhati", "vedic", "jyotish",
    "nakshatra", "sub-lord", "vimshottari", "dasha", "horary", "swisseph",
    "sidereal", "stellar",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyswisseph>=2.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
kpastro = "kpastro.cli:main"

[project.urls]
Homepage = "https://github.com/Rituparno-Majumdar/kp-astrology"
Repository = "https://github.com/Rituparno-Majumdar/kp-astrology"
Changelog = "https://github.com/Rituparno-Majumdar/kp-astrology/blob/main/CHANGELOG.md"
Documentation = "https://rituparno-majumdar.github.io/kp-astrology/"
Issues = "https://github.com/Rituparno-Majumdar/kp-astrology/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kpastro --cov-report=term-missing:skip-covered --cov-fail-under=85"